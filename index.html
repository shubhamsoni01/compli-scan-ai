<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/compliscan-logo.jpg" />
    <link rel="apple-touch-icon" href="/compliscan-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompliScan AI — Smart Packaged Product Compliance Inspector</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('compliscan_theme') || 'light';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
